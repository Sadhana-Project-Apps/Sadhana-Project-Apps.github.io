/* ---------- Project files: tender, LOA, insurance, stamp duty and other reference documents ----------
   Uploaded files are split into pieces and kept in the database (no separate storage bill).
   Links (e.g. Google Drive) can be saved instead of uploading. */
const FILE_CATS = ['Tender documents','Letter of Award (LOA)','Contract / agreement','Insurance','Stamp duty (LHDN)','Permits & approvals','Bonds & guarantees','Drawings & specifications','Method statement & HIRARC','Correspondence','Others'];
const FILE_CHUNK = 900000;            // characters of base64 per database record
const FILE_MAX = 200 * 1024 * 1024;     // largest file we accept before compressing
const FILE_TARGET = 9.5 * 1024 * 1024;  // every stored file is kept under 10 MB
const PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
function loadJs(src){ return new Promise((res, rej) => { const sc = document.createElement('script'); sc.src = src; sc.onload = res; sc.onerror = () => rej(new Error('Could not load ' + src)); document.head.appendChild(sc); }); }
async function pdfjs(){
  if(!window.pdfjsLib){ await loadJs(PDFJS + 'pdf.min.js'); window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + 'pdf.worker.min.js'; }
  return window.pdfjsLib;
}
const canvasBlob = (c, q) => new Promise(r => c.toBlob(r, 'image/jpeg', q));
const baseName = n => String(n || 'file').replace(/\.[^.]+$/, '');
// Returns a version of the file that is under 10 MB (photos and PDFs are re-compressed, other files are zipped).
async function shrinkFile(file, say){
  say = say || (() => {});
  if(file.size <= FILE_TARGET) return {blob: file, name: file.name, mime: file.type || 'application/octet-stream', size: file.size};
  const mime = file.type || '', nm = file.name || '';
  const mb = fmtSize(file.size);
  if(/^image\//.test(mime) || /\.(jpe?g|png|webp|heic)$/i.test(nm)){
    say('Compressing photo (' + mb + ')…');
    const bmp = await createImageBitmap(file);
    for(const [maxD, q] of [[4000, .85], [3200, .8], [2600, .75], [2000, .7], [1600, .65], [1200, .6]]){
      const k = Math.min(1, maxD / Math.max(bmp.width, bmp.height));
      const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
      c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
      const b = await canvasBlob(c, q);
      if(b && b.size <= FILE_TARGET) return {blob: b, name: baseName(nm) + '.jpg', mime: 'image/jpeg', size: b.size, origSize: file.size, compressed: true};
    }
    throw Object.assign(new Error('too big'), {code: 'too-big'});
  }
  if(/pdf/.test(mime) || /\.pdf$/i.test(nm)){
    const lib = await pdfjs();
    const pdf = await lib.getDocument({data: new Uint8Array(await file.arrayBuffer())}).promise;
    const n = pdf.numPages;
    for(const [dpi, q] of [[150, .72], [120, .62], [100, .55], [80, .5], [60, .45]]){
      const out = new jspdf.jsPDF({unit: 'pt', compress: true});
      out.deletePage(1);
      for(let i = 1; i <= n; i++){
        say(`Compressing PDF (${mb}) — page ${i} of ${n}…`);
        const page = await pdf.getPage(i); const vp1 = page.getViewport({scale: 1});
        const sc = Math.min(dpi / 72, Math.sqrt(12e6 / (vp1.width * vp1.height)));   // phones can't draw huge canvases
        const vp = page.getViewport({scale: sc});
        const c = document.createElement('canvas'); c.width = Math.ceil(vp.width); c.height = Math.ceil(vp.height);
        const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
        await page.render({canvasContext: ctx, viewport: vp}).promise;
        out.addPage([vp1.width, vp1.height], vp1.width > vp1.height ? 'l' : 'p');
        out.addImage(c.toDataURL('image/jpeg', q), 'JPEG', 0, 0, vp1.width, vp1.height, undefined, 'NONE');
        c.width = c.height = 0; page.cleanup();
      }
      const b = out.output('blob');
      if(b.size <= FILE_TARGET){ pdf.destroy(); return {blob: new Blob([b], {type: 'application/pdf'}), name: nm, mime: 'application/pdf', size: b.size, origSize: file.size, compressed: true}; }
    }
    pdf.destroy();
    throw Object.assign(new Error('too big'), {code: 'too-big'});

async function walkEntry(entry, path, out){
  if(entry.isFile){ await new Promise(res => entry.file(f => { out.push({file: f, path: path + f.name}); res(); }, () => res())); return; }
  if(entry.isDirectory){
    const reader = entry.createReader();
    let batch;
    do { batch = await new Promise(res => reader.readEntries(res, () => res([]))); for(const e of batch) await walkEntry(e, path + entry.name + '/', out); } while(batch.length);
  }
}

  const out = [];

    for(const it of items) await walkEntry(it, '', out);
    if(single) out.forEach(o => o.path = o.path.split('/').slice(1).join('/'));
  } else [...e.dataTransfer.files].forEach(f => out.push({file: f, path: f.name}));
  prepareBulk(S.view.id, out);
});

    <p class="small" style="margin:8px 0 0;color:${bad ? 'var(--bad)' : 'var(--ok)'}">${bad ? 'Not ready: publish the latest rules in Firebase (Firestore Database → (default) → Rules → paste → Publish), then check again.' : 'Everything is ready ✓'}</p>`;
  const o1 = $('#setupOut'); if(o1) o1.innerHTML = S.setupOut;
  btn.disabled = false;
}
/* ---------- admin: rename a document's title / subject (also after signing) ---------- */
function renameDocForm(id){
  const d = docById(id); if(!d || !S.canEdit) return; const T = TT(d);
  const flds = T.fields.filter(f => f.t === 'text' && f.phase !== 'response');

  showModal(`<div class="box"><div class="mh"><h3>Rename / edit subject</h3></div><div class="mb"><div class="fgrid">
    <div class="fld"><label>Title shown in the app</label><input id="rnTitle" value="${esc(d.customTitle || '')}" placeholder="${esc((() => { try { return T.title(d.data || {}); } catch(e){ return T.name; } })())}"><div class="hint">Leave empty to use the automatic title.</div></div>
    ${flds.map(f => `<div class="fld"><label>${esc(f.l)}</label><input data-rn="${esc(f.k)}" value="${esc((d.data || {})[f.k] || '')}"></div>`).join('')}

async function renameDocSave(id, btn){

  document.querySelectorAll('[data-rn]').forEach(i => data[i.dataset.rn] = i.value.trim());
  try {
    await S.db.doc('docs/' + id).update({data, customTitle: $('#rnTitle').value.trim(), updatedAt: new Date().toISOString(), updatedBy: S.me || null});
    Object.assign(d, {data, customTitle: $('#rnTitle').value.trim()});
    closeModal(); toast('Saved'); render();
  } catch(e){ btn.disabled = false; dbErr(e); }
}
/* ---------- admin: rename document types (titles on buttons, lists and PDFs) ---------- */
function typeNamesForm(){

    <p class="small muted" style="margin-top:0">Rename a document, move it to another folder, and choose which ISO standards it is evidence for. Reference numbers (e.g. DSR, PR) stay the same.</p>
    ${DOC_CATS.map(c => `<div class="eyebrow" style="margin:14px 0 6px">${c.icon} ${esc(c.name)}</div>${catTypes(c).map(k => `<div class="card pad" style="box-shadow:none;margin-bottom:10px"><div class="fgrid">

      <div class="fld half"><label>Folder</label><select data-tc="${k}">${DOC_CATS.map(x => `<option value="${x.k}" ${x.k === typeCat(k) ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select></div>
      <div class="fld half"><label>ISO evidence for</label><div class="checks" style="gap:4px 12px">${ISO_STDS.map(st => `<label><input type="checkbox" data-ti="${k}" value="${st.k}" ${isoOf(k)[st.k] ? 'checked' : ''}>ISO ${st.k}</label>`).join('')}</div></div>
      <div class="fld"><label>Short description</label><input data-tn="${k}" data-f="blurb" value="${esc(TYPES[k].blurb)}" placeholder="${esc(TYPE_ORIG[k].blurb)}"></div>
    </div></div>`).join('')}`).join('')}
  </div><div class="mf"><button class="btn ghost" data-act="typenamesreset" style="margin-right:auto">Reset to original</button><button class="btn ghost" data-act="closemodal">Cancel</button><button class="btn pri" data-act="typenamessave">Save</button></div></div>`);
}
async function typeNamesSave(btn){
  const out = {};
  document.querySelectorAll('[data-tn]').forEach(i => { const k = i.dataset.tn, v = i.value.trim(); if(v && v !== TYPE_ORIG[k][i.dataset.f]) (out[k] = out[k] || {})[i.dataset.f] = v; });
  btn.disabled = true;
  try {
    const cats = {}; document.querySelectorAll('[data-tc]').forEach(i => { if(i.value !== (DEFAULT_CAT[i.dataset.tc] || 'OPS')) cats[i.dataset.tc] = i.value; });
    const iso = {}; TYPE_KEYS.forEach(k => { const sel = [...document.querySelectorAll(`[data-ti="${k}"]:checked`)].map(i => i.value).sort(); const def = Object.keys(ISO_MAP[k] || {}).sort(); if(sel.join() !== def.join()) iso[k] = sel; });
    await S.db.doc('settings/company').set({...(S.company || {}), typeNames: out, typeCats: cats, typeIso: iso});
    S.company = {...(S.company || {}), typeNames: out, typeCats: cats, typeIso: iso}; applyTypeNames(); S.view.cat = null;
    closeModal(); toast('Saved'); render();
  } catch(e){ btn.disabled = false; dbErr(e); }
}
/* ---------- admin: rename a group (folder) of project files ---------- */
function renameGroupForm(pid, g){
  showModal(`<div class="box" style="max-width:460px"><div class="mh"><h3>Rename group</h3></div><div class="mb"><div class="fld"><label>Group name</label><input id="rgName" value="${esc(g)}"></div></div>
  <div class="mf"><button class="btn ghost" data-act="closemodal">Cancel</button><button class="btn pri" data-act="renamegroupsave" data-p="${esc(pid)}" data-g="${esc(g)}">Save</button></div></div>`);
}
async function renameGroupSave(btn){
  const pid = btn.dataset.p, g = btn.dataset.g, nn = $('#rgName').value.trim();
  if(!nn || nn === g){ closeModal(); return; }
  btn.disabled = true;
  try {
    for(const f of S.files.filter(f => f.projectId === pid && (f.folder || f.category || 'General') === g))
      await S.db.doc('files/' + f.id).update({folder: nn, category: nn});
    closeModal(); toast('Group renamed'); render();
  } catch(e){ btn.disabled = false; dbErr(e); }
}
function expiringFiles(){
  return S.files.filter(f => f.status !== 'uploading' && projById(f.projectId)).map(f => ({f, ex: expiryInfo(f)})).filter(x => x.ex && x.ex.days <= 30).sort((a, b) => a.ex.days - b.ex.days);
}

/* --- recent + on-demand documents --- */
const RECENT_LIMIT = 300;
S.recent = []; S.extra = {}; S.loadedProj = {}; S.allLoaded = false;
function recomputeDocs(){
  const m = {...S.extra}; S.recent.forEach(d => m[d.id] = d);
  S.docs = Object.values(m).filter(d => TYPES[d.type]);
}
async function loadProjectDocs(pid){
  if(!pid || S.loadedProj[pid] || S.allLoaded || !S.recentFull) return;
  S.loadedProj[pid] = 1;
  try { const s = await S.db.collection('docs').where('projectId', '==', pid).get(); s.docs.forEach(x => S.extra[x.id] = {id: x.id, ...x.data()}); recomputeDocs(); softRender(); }
  catch(e){ S.loadedProj[pid] = 0; console.error(e); }
}
async function loadAllDocs(btn){
  if(btn){ btn.disabled = true; btn.textContent = 'Loading…'; }
  try { const s = await S.db.collection('docs').get(); s.docs.forEach(x => S.extra[x.id] = {id: x.id, ...x.data()}); S.allLoaded = true; recomputeDocs(); render(); }
  catch(e){ dbErr(e); if(btn){ btn.disabled = false; btn.textContent = 'Load older documents'; } }
}

/* --- install as an app --- */
S.installEvt = null;
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent);
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); S.installEvt = e; softRender(); });
window.addEventListener('appinstalled', () => { S.installEvt = null; toast('Installed ✓ — open Sadhana from your home screen'); softRender(); });
if('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
function installBanner(){
  if(isStandalone()) return '';
  try { if(localStorage.getItem('sde-hide-install')) return ''; } catch(e){}
  if(S.installEvt) return `<div class="vhint" style="background:#e9f6ee;color:#1f6b3f;align-items:center"><b>📲</b><span style="flex:1"><b style="font-size:14px">Install Sadhana (Operation &amp; Safety) as an app</b><br>Opens full screen from your home screen, like any app.</span><button class="btn pri sm" data-act="install">Install</button><button class="xbtn" data-act="hideinstall" title="Hide">×</button></div>`;
  if(isIOS()) return `<div class="vhint" style="align-items:center"><b>📲</b><span style="flex:1"><b style="font-size:14px">Install on iPhone</b><br>In Safari tap <b>Share</b> ⬆️ then <b>Add to Home Screen</b>.</span><button class="xbtn" data-act="hideinstall" title="Hide">×</button></div>`;
  return '';
}

/* --- boot --- */
let unsubs = [];
function stopData(){ unsubs.forEach(u => { try { u(); } catch(e){} }); unsubs = []; S.loaded = {p: 0, d: 0}; S.projects = []; S.docs = []; S.recent = []; S.extra = {}; S.loadedProj = {}; S.allLoaded = false; S.files = []; }
function startData(){
  const db = S.db;
  const onErr = e => { console.error(e); if(e && e.code === 'permission-denied') return; toast('Lost connection to records — reload the page.', true); };
  unsubs.push(db.collection('projects').onSnapshot(s => { S.projects = s.docs.map(x => ({id: x.id, ...x.data()})); S.loaded.p = 1; softRender(); }, onErr));
  unsubs.push(db.collection('files').onSnapshot(s => { S.files = s.docs.map(x => ({id: x.id, ...x.data()})); softRender(); }, () => {}));
  // Only recent documents stream live (keeps daily database reads inside the free plan).
  // Older ones load when a project or the full register is opened.
  unsubs.push(db.collection('docs').orderBy('createdAt', 'desc').limit(RECENT_LIMIT).onSnapshot(s => {
    S.recent = s.docs.map(x => ({id: x.id, ...x.data()})); S.recentFull = s.size >= RECENT_LIMIT; recomputeDocs(); S.loaded.d = 1; softRender();
  }, onErr));
  unsubs.push(db.collection('users').onSnapshot(s => {
    S.users = s.docs.map(x => ({id: x.id, ...x.data()}));
    S.users.forEach(u => { if(u.name) S.names[u.id] = u.name; });
    softRender();
  }, () => {}));
  unsubs.push(startChat(db));
  unsubs.push(db.doc('settings/company').onSnapshot(s => { S.company = s.exists ? s.data() : {}; applyTypeNames(); softRender(); }, () => {}));
}
async function onSignedIn(u){
  S.me = u.uid; S.names[u.uid] = u.displayName || u.email || 'Me';
  const ref = S.db.doc('users/' + u.uid);
  let snap;
  try { snap = await ref.get(); } catch(e){ snap = {exists: false}; }
  if(!snap.exists){
    const base = {name: S.pendingName || u.displayName || (u.email || '').split('@')[0], email: u.email || '', createdAt: new Date().toISOString()};
    const uref = FB.fs.doc(FB.db, 'users/' + u.uid);
    // The security rules only allow the owner's email to start as admin; everyone else starts as pending.
    try { await FB.fs.setDoc(uref, {...base, role: 'admin'}); }
    catch(e){ try { await FB.fs.setDoc(uref, {...base, role: 'pending'}); } catch(e2){ console.error(e2); } }
  }
  if(S.unsubMe) S.unsubMe();
  S.unsubMe = ref.onSnapshot(s => {
    const d = s.exists ? s.data() : {role: 'pending'};
    if(isOwnerEmail(u) && s.exists && d.role !== 'admin'){ ref.update({role: 'admin'}).catch(console.error); d.role = 'admin'; }
    const prev = S.myRole; S.myRole = d.role || 'pending';
    if(d.name) S.names[u.uid] = d.name;
    S.canEdit = S.myRole === 'admin'; S.canWrite = S.myRole === 'admin' || S.myRole === 'staff';
    if(S.canWrite && !(prev === 'admin' || prev === 'staff')){ startData(); }
    if(!S.canWrite && (prev === 'admin' || prev === 'staff')){ stopData(); }
    S.authState = S.canWrite ? 'in' : 'pending';
    render();
  }, e => { console.error(e); S.authState = 'pending'; render(); });
}
(async function boot(){
  S.users = []; S.authState = 'loading';
  if(!window.APP_CONFIG || !window.APP_CONFIG.firebase){ S.authState = 'nosetup'; render(); return; }
  try {
    const [appM, authM, fs] = await Promise.all([import(FB_BASE + 'firebase-app.js'), import(FB_BASE + 'firebase-auth.js'), import(FB_BASE + 'firebase-firestore.js')]);
    Object.assign(FB, {appM, authM, fs});
    FB.app = appM.initializeApp(window.APP_CONFIG.firebase);
    FB.auth = authM.getAuth(FB.app);
    try { FB.db = fs.initializeFirestore(FB.app, {localCache: fs.persistentLocalCache({tabManager: fs.persistentMultipleTabManager()})}); }
    catch(e){ FB.db = fs.getFirestore(FB.app); }
  } catch(e){
    console.error(e);
    $('#main').innerHTML = authShell('<h3>Can\'t connect</h3><p class="muted">Check your internet connection and reload the page.</p>');
    return;
  }
  S.db = makeDB(); S.assets = photoStore; S.dl = downloader; S.sample = aiSample;
  if(!window.APP_CONFIG.aiEndpoint) S.sample = null;
  authM_getRedirect();
  FB.authM.onAuthStateChanged(FB.auth, u => {
    stopData(); if(S.unsubMe){ S.unsubMe(); S.unsubMe = null; } S.myRole = null; S.canWrite = false; S.canEdit = false;
    if(!u){ S.me = null; S.authState = 'out'; S.view = {name: 'home'}; render(); return; }
    S.authState = 'loading'; render();
    onSignedIn(u);
  });
})();
function authM_getRedirect(){ try { FB.authM.getRedirectResult(FB.auth).catch(authError); } catch(e){} }

</script>
